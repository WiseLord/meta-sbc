header:
  version: 23

machine: bananapi-m2-zero
distro: poky

target:
  - core-image-minimal

repos:

  bitbake:
    url: https://git.openembedded.org/bitbake
    branch: "2.18"
    layers:
      .: disabled

  meta-arm:
    url: https://git.yoctoproject.org/meta-arm
    branch: wrynose
    layers:
      meta-arm:
      meta-arm-bsp:
      meta-arm-toolchain:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: wrynose
    layers:
      meta-filesystems:
      meta-gnome:
      meta-initramfs:
      meta-multimedia:
      meta-networking:
      meta-oe:
      meta-perl:
      meta-python:
      meta-webserver:
      meta-xfce:

  meta-sunxi:
    url: https://github.com/linux-sunxi/meta-sunxi.git
    branch: master

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    branch: wrynose
    layers:
      meta-poky:
      meta-yocto-bsp:

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    branch: wrynose
    layers:
      meta:
      meta-selftest:
      meta-skeleton:

